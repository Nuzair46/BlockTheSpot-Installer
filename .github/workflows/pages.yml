name: Spotify download library
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/test-site.mjs', 'scripts/install.ps1', 'src/BlockTheSpot.Core/Patch/blockthespot-ui.js', '.github/workflows/pages.yml']
  pull_request:
    branches: [main]
    paths: ['site/**', 'scripts/test-site.mjs', 'scripts/install.ps1', 'src/BlockTheSpot.Core/Patch/blockthespot-ui.js', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.snapshot.outputs.changed }}
      ref: ${{ steps.snapshot.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Refresh version metadata
        run: node site/scripts/update-catalog.mjs
      - name: Validate refreshed catalog
        run: node --test scripts/test-site.mjs
      - name: Commit only a changed catalog
        id: snapshot
        run: |
          if git diff --quiet -- site/data/catalog.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add site/data/catalog.json
            git commit -m 'Update Spotify download catalog'
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # A new Spotify build is where a kit silently stops matching. This says so in the run summary
      # instead of leaving it to be discovered from a user report.
      - name: Check the shipped kit against the newest build
        if: steps.snapshot.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/check-kit.mjs
  build:
    needs: refresh
    # A manual dispatch also comes from the release watcher after it committed new observations.
    if: always() && !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || needs.refresh.outputs.changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.refresh.outputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - name: Build Astro and static APIs
        run: npm run build --prefix site
      - name: Publish the install script and panel on Pages
        run: |
          cp scripts/install.ps1 site/dist/install.ps1
          cp src/BlockTheSpot.Core/Patch/blockthespot-ui.js site/dist/blockthespot-ui.js
      - name: Verify catalog, filters, links, and built API contracts
        run: node --test scripts/test-site.mjs
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site/dist
  deploy:
    if: always() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy library and APIs
        id: deployment
        uses: actions/deploy-pages@v5
