; =========================
; URL block list
; =========================
[URL_block]
Enable=1
1=/ads/
2=/ad-logic/
3=/gabo-receiver-service/
; Updates are stopped here, in the client's own request path. /desktop-update/ is deliberately NOT
; blocked: that is the status query the About panel reads for its version, and blocking it leaves
; the panel empty. The update package itself is fetched from upgrade.scdn.co/upgrade/client/, so
; blocking that path lets Spotify ask about updates but never download one. The installer and
; install.ps1 also lock %LOCALAPPDATA%\Spotify\Update as a second line of defence.
4=/upgrade/client/
; Ad and tracking endpoints read out of the 1.3.1.234 bundle.
5=/leavebehinds/ads
6=sponsored-recommendations.spotify.com
7=/dsa-metadata
8=pixel.spotify.com
9=pixel-static.spotify.com
10=/js/retargeting-pixels.js
